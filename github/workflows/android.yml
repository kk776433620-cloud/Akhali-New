name: Build Al-Kahali Assistant Production APK

on:
  push:
    branches: [ "main", "master", "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile and Package Android Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Unzip Project Archive
        run: |
          find . -iname "*.zip" -exec unzip -o {} -d . \; || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix JVM Target Mismatch
        run: |
          find . -name "build.gradle" -type f -exec sed -i 's/VERSION_1_8/VERSION_17/g' {} \;
          find . -name "build.gradle" -type f -exec sed -i 's/1_8/17/g' {} \;
          find . -name "build.gradle.kts" -type f -exec sed -i 's/JVM_1_8/JVM_17/g' {} \;
          find . -name "build.gradle.kts" -type f -exec sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' {} \;
          find . -name "build.gradle.kts" -type f -exec sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" {} \;

      - name: Make Gradlew Executable
        run: |
          find . -name "gradlew" -exec chmod +x {} \; || true

      - name: Build APK
        run: |
          BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          TARGET_DIR=$(dirname "$BUILD_FILE")
          echo "Building in: $TARGET_DIR"
          cd "$TARGET_DIR"
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AlKahali-Smart-Assistant-App
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 30
