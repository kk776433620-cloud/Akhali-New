name: Build Al-Kahali Assistant Production APK

on:
  push:
    branches: [ "main", "master", "رئيسي" ]
  pull_request:
    branches: [ "main", "master", "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile and Package Android Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Unzip Project Archive
        run: |
          find . -iname "*.zip" -exec unzip -o {} -d . \;
          find . -iname "*.zip" -exec unzip -o {} -d . \;

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradlew Executable
        run: |
          find . -name "gradlew" -exec chmod +x {} \; || true

      - name: Build APK with Matching JVM Target
        run: |
          BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: No build.gradle found!"
            exit 1
          fi

          TARGET_DIR=$(dirname "$BUILD_FILE")
          echo "Building in: $TARGET_DIR"
          cd "$TARGET_DIR"

          # فرض إصدار JVM المعياري على المترجمين لتفادي التضارب
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug -Dorg.gradle.java.home=$JAVA_HOME -Pkotlin.compiler.jvmTarget=1.8 -Dkotlin.compiler.jvmTarget=1.8
          else
            gradle assembleDebug -Dorg.gradle.java.home=$JAVA_HOME -Pkotlin.compiler.jvmTarget=1.8 -Dkotlin.compiler.jvmTarget=1.8
          fi

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AlKahali-Smart-Assistant-App
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 30
