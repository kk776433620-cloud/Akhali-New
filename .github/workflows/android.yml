name: Auto Structure and Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restructure Project Files Automatically
        run: |
          echo "=== Organizing project structure ==="
          mkdir -p app/src/main/java/com/akhali/smartassistant/services
          mkdir -p app/src/main/java/com/akhali/smartassistant/network
          mkdir -p app/src/main/java/com/akhali/smartassistant/engine
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          # نقل الملفات المتبقية
          mv FloatingWidgetService.kt app/src/main/java/com/akhali/smartassistant/services/ 2>/dev/null || true
          mv SystemControlAccessibilityService.kt app/src/main/java/com/akhali/smartassistant/services/ 2>/dev/null || true
          mv VoiceRecognitionEngine.kt app/src/main/java/com/akhali/smartassistant/services/ 2>/dev/null || true
          mv GeminiCloudClient.kt app/src/main/java/com/akhali/smartassistant/network/ 2>/dev/null || true
          mv PredictiveEngine.kt app/src/main/java/com/akhali/smartassistant/engine/ 2>/dev/null || true
          mv *.kt app/src/main/java/com/akhali/smartassistant/ 2>/dev/null || true
          mv layout_*.xml app/src/main/res/layout/ 2>/dev/null || true
          mv accessibility_*.xml app/src/main/res/xml/ 2>/dev/null || true

          # كتابة ملف MainActivity.kt
          cat << "EOF" > app/src/main/java/com/akhali/smartassistant/MainActivity.kt
          package com.akhali.smartassistant

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import com.akhali.smartassistant.services.FloatingWidgetService
          import com.google.ai.client.generativeai.GenerativeModel
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.util.Locale

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {

              private lateinit var tts: TextToSpeech
              private lateinit var speechRecognizer: SpeechRecognizer
              private lateinit var etMessageInput: EditText
              private lateinit var etApiKey: EditText
              private lateinit var tvChatLog: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  tts = TextToSpeech(this, this)
                  etMessageInput = findViewById(R.id.etMessageInput)
                  etApiKey = findViewById(R.id.etApiKey)
                  tvChatLog = findViewById(R.id.tvChatLog)

                  val prefs = getSharedPreferences("AkhaliPrefs", Context.MODE_PRIVATE)
                  etApiKey.setText(prefs.getString("GEMINI_KEY", ""))

                  findViewById<Button>(R.id.btnSaveKey).setOnClickListener {
                      val key = etApiKey.text.toString().trim()
                      if (key.isNotEmpty()) {
                          prefs.edit().putString("GEMINI_KEY", key).apply()
                          Toast.makeText(this, "تم حفظ المفتاح الجديد بنجاح", Toast.LENGTH_SHORT).show()
                      } else {
                          Toast.makeText(this, "يرجى أدخال مفتاح جديد أولاً", Toast.LENGTH_SHORT).show()
                      }
                  }

                  findViewById<Button>(R.id.btnSend).setOnClickListener {
                      val text = etMessageInput.text.toString().trim()
                      if (text.isNotEmpty()) {
                          processUserQuery(text)
                          etMessageInput.setText("")
                      }
                  }

                  setupSpeechRecognizer()

                  findViewById<Button>(R.id.btnStartService).setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          val intent = Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                          startActivity(intent)
                      } else {
                          startService(Intent(this, FloatingWidgetService::class.java))
                          Toast.makeText(this, "تم تشغيل الزر العائم", Toast.LENGTH_SHORT).show()
                      }
                  }

                  findViewById<Button>(R.id.btnAccessibility).setOnClickListener {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
              }

              private fun processUserQuery(query: String) {
                  appendMessage("أنت: " + query)
                  val prefs = getSharedPreferences("AkhaliPrefs", Context.MODE_PRIVATE)
                  val apiKey = prefs.getString("GEMINI_KEY", "") ?: ""

                  if (apiKey.isEmpty()) {
                      val noKeyMsg = "يرجى أدخال مفتاح Gemini API الجديد والضغط على حفظ."
                      appendMessage("المساعد: " + noKeyMsg)
                      speakText(noKeyMsg)
                      return
                  }

                  lifecycleScope.launch {
                      appendMessage("المساعد: جاري التفكير والرد...")
                      try {
                          val responseText = withContext(Dispatchers.IO) {
                              val generativeModel = GenerativeModel(
                                  modelName = "gemini-1.5-flash",
                                  apiKey = apiKey
                              )
                              val response = generativeModel.generateContent(query)
                              response.text ?: "لم أستطع الحصول على إجابة."
                          }
                          tvChatLog.text = tvChatLog.text.toString().replace("المساعد: جاري التفكير والرد...", "المساعد: " + responseText)
                          speakText(responseText)
                      } catch (e: Exception) {
                          val errorMsg = "حدث خطأ في المفتاح أو الاتصال: " + e.localizedMessage
                          tvChatLog.text = tvChatLog.text.toString().replace("المساعد: جاري التفكير والرد...", "المساعد: " + errorMsg)
                          speakText("حدث خطأ، يرجى التثبت من المفتاح")
                      }
                  }
              }

              private fun appendMessage(msg: String) {
                  tvChatLog.append("\n\n" + msg)
              }

              private fun speakText(text: String) {
                  if (::tts.isInitialized) {
                      tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, null)
                  }
              }

              private fun setupSpeechRecognizer() {
                  speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ar-SA")
                  }

                  speechRecognizer.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(params: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(rmsdB: Float) {}
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onError(error: Int) {
                          Toast.makeText(applicationContext, "لم أتمكن من الاستماع، حاول مجدداً", Toast.LENGTH_SHORT).show()
                      }
                      override fun onResults(results: Bundle?) {
                          val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          if (!matches.isNullOrEmpty()) {
                              val spokenText = matches[0]
                              processUserQuery(spokenText)
                          }
                      }
                      override fun onPartialResults(partialResults: Bundle?) {}
                      override fun onEvent(eventType: Int, params: Bundle?) {}
                  })
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      tts.language = Locale("ar")
                  }
              }

              override fun onDestroy() {
                  if (::tts.isInitialized) {
                      tts.stop()
                      tts.shutdown()
                  }
                  if (::speechRecognizer.isInitialized) {
                      speechRecognizer.destroy()
                  }
                  super.onDestroy()
              }
          }
          EOF

          # تصميم الواجهة الرئيسية
          cat << "EOF" > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center_horizontal"
                  android:layout_marginBottom="8dp"
                  android:text="المساعد الأكحلي"
                  android:textSize="22sp"
                  android:textStyle="bold" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:layout_marginBottom="8dp">

                  <EditText
                      android:id="@+id/etApiKey"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:hint="أدخل مفتاح Gemini API الجديد"
                      android:inputType="textPassword" />

                  <Button
                      android:id="@+id/btnSaveKey"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="حفظ" />
              </LinearLayout>

              <ScrollView
                  android:id="@+id/scrollChat"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:background="#F5F5F5"
                  android:padding="8dp"
                  android:layout_marginBottom="8dp">

                  <TextView
                      android:id="@+id/tvChatLog"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="ضع المفتاح الجديد بالأعلى ثم اضغط حفظ لتفعيل الذكاء الاصطناعي."
                      android:textColor="#333333"
                      android:textSize="16sp" />
              </ScrollView>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:layout_marginBottom="8dp">

                  <EditText
                      android:id="@+id/etMessageInput"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:hint="اكتب سؤالك هنا..."
                      android:padding="12dp" />

                  <Button
                      android:id="@+id/btnSend"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="إرسال" />
              </LinearLayout>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:weightSum="2">

                  <Button
                      android:id="@+id/btnStartService"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="الزر العائم"
                      android:layout_marginEnd="4dp" />

                  <Button
                      android:id="@+id/btnAccessibility"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="إمكانية الوصول"
                      android:layout_marginStart="4dp" />
              </LinearLayout>

          </LinearLayout>
          EOF

          # تصميم الشاشة العائمة
          cat << "EOF" > app/src/main/res/layout/layout_floating_widget.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:background="#80000000"
              android:padding="8dp">
              <ImageView
                  android:layout_width="48dp"
                  android:layout_height="48dp"
                  android:src="@drawable/ic_launcher" />
          </FrameLayout>
          EOF

          # إعدادات إمكانية الوصول
          cat << "EOF" > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100" />
          EOF

          # ملف styles.xml
          cat << "EOF" > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.App" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#2196F3</item>
                  <item name="colorPrimaryDark">#1976D2</item>
                  <item name="colorAccent">#03A9F4</item>
              </style>
          </resources>
          EOF

          # أيقونة التطبيق
          cat << "EOF" > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#2196F3"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          # AndroidManifest.xml المكتمل
          cat << "EOF" > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.BIND_ACCESSIBILITY_SERVICE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="المساعد الأكحلي"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.App">

                  <activity
                      android:name="com.akhali.smartassistant.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name="com.akhali.smartassistant.services.FloatingWidgetService"
                      android:enabled="true"
                      android:exported="false" />

                  <service
                      android:name="com.akhali.smartassistant.services.SystemControlAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <service
                      android:name="com.akhali.smartassistant.services.VoiceRecognitionEngine"
                      android:exported="false" />

              </application>
          </manifest>
          EOF

          # settings.gradle
          echo "include ':app'" > settings.gradle

          # build.gradle الرئيسي
          cat << "EOF" > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # app/build.gradle
          cat << "EOF" > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
              id 'kotlin-kapt'
          }

          android {
              namespace 'com.akhali.smartassistant'
              compileSdk 34

              defaultConfig {
                  applicationId "com.akhali.smartassistant"
                  minSdk 28
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.10.1'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              
              // Room Database
              implementation 'androidx.room:room-runtime:2.6.1'
              implementation 'androidx.room:room-ktx:2.6.1'
              kapt 'androidx.room:room-compiler:2.6.1'

              // Google AI (Gemini) SDK
              implementation 'com.google.ai.client.generativeai:generativeai:0.2.0'
              implementation 'com.squareup.okhttp3:okhttp:4.11.0'
              implementation 'com.google.code.gson:gson:2.10.1'

              // Coroutines & Lifecycle
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
          }
          EOF

      - name: Build APK with Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          ./gradlew :app:assembleDebug --no-daemon -Pandroid.useAndroidX=true

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Akhali-App-Android9
          path: "app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
