name: Auto-Structure and Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restructure Project Files Automatically
        run: |
          echo "=== Organizing project structure ==="
          mkdir -p app/src/main/java/com/example/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml

          # نقل ملفات الأكواد إلى مجلد الموديول الصحيح
          mv *.kt app/src/main/java/com/example/app/ 2>/dev/null || true
          mv AndroidManifest.xml app/src/main/ 2>/dev/null || true
          mv layout_*.xml app/src/main/res/layout/ 2>/dev/null || true
          mv accessibility_*.xml app/src/main/res/xml/ 2>/dev/null || true

          # إنشاء ملف settings.gradle لتعريف مجلد app كموديول أندرويد
          echo "include ':app'" > settings.gradle

          # إنشاء build.gradle الرئيسي
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # إعداد build.gradle الداخلي الخاص بالموديول app
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }

          android {
              namespace 'com.example.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.app"
                  minSdk 28  // يدعم أندرويد 9 فما فوق
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: Fix Kotlin Target Settings
        run: |
          echo "kotlin.jvm.target.validation.mode=IGNORE" >> gradle.properties

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug -Pkotlin.jvm.target.validation.mode=IGNORE

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Akhali-App-Android9
          path: "app/build/outputs/apk/debug/*.apk"
