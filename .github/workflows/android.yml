name: Build Al-Kahali Assistant Production APK

on:
  push:
    branches: [ "main", "master", "رئيسي" ]
  pull_request:
    branches: [ "main", "master", "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile and Package Android Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Unzip Alakhali Project Archive
        run: |
          if [ -f "Alakhali-main.zip" ]; then
            echo "Unzipping Alakhali-main.zip..."
            unzip -o Alakhali-main.zip -d .
          else
            echo "Searching for any zip archive..."
            ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o "$ZIP_FILE" -d .
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate and Build APK
        run: |
          BUILD_FILE=$(find . -name "build.gradle" | head -n 1)
          
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: Could not locate build.gradle inside extracted files!"
            exit 1
          fi

          TARGET_DIR=$(dirname "$BUILD_FILE")
          echo "Building inside directory: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: AlKahali-Smart-Assistant-App
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 30
