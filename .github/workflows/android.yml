name: Build Al-Kahali Assistant Production APK

on:
  push:
    branches: [ "main", "master", "رئيسي" ]
  pull_request:
    branches: [ "main", "master", "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile and Package Android Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Unzip Project Files if ZIP Exists
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK Safe Execution
        run: |
          BUILD_FILE=$(find . -name "build.gradle" | head -n 1)
          
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: build.gradle not found in repository or zip archive!"
            exit 1
          fi

          TARGET_DIR=$(dirname "$BUILD_FILE")
          echo "Building inside directory: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: AlKahali-Smart-Assistant-App
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 30
