name: Build Al-Kahali Assistant Production APK

on:
  push:
    branches: [ "main", "master", "رئيسي" ]
  pull_request:
    branches: [ "main", "master", "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile and Package Android Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Unzip All Archive Layers (Recursive Unzip)
        run: |
          echo "=== Extracting outer zip files ==="
          find . -iname "*.zip" -exec unzip -o {} -d . \;
          
          echo "=== Extracting any nested zip files ==="
          find . -iname "*.zip" -exec unzip -o {} -d . \;

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate Project and Build APK
        run: |
          BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: No build.gradle or build.gradle.kts found anywhere in the repository!"
            echo "Listing extracted contents for debugging:"
            ls -la
            exit 1
          fi

          TARGET_DIR=$(dirname "$BUILD_FILE")
          echo "Project locate at: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradlew wrapper missing, building with system gradle..."
            gradle assembleDebug --stacktrace
          fi

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: AlKahali-Smart-Assistant-App
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 30
