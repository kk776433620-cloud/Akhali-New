name: Auto-Structure and Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restructure Project Files Automatically
        run: |
          echo "=== Organizing project structure ==="
          mkdir -p app/src/main/java/com/akhali/smartassistant
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable

          # نقل ملفات الأكواد والموارد
          mv *.kt app/src/main/java/com/akhali/smartassistant/ 2>/dev/null || true
          mv layout_*.xml app/src/main/res/layout/ 2>/dev/null || true
          mv accessibility_*.xml app/src/main/res/xml/ 2>/dev/null || true

          # إنشاء أيقونة التطبيق في مجلد drawable لتجنب مشاكل mipmap
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#2196F3"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          # كتابة ملف AndroidManifest.xml صحيح وسليم 100% يضمن ظهور الأيقونة على الشاشة
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.BIND_ACCESSIBILITY_SERVICE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Akhali Assistant"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">

                  <activity
                      android:name="com.akhali.smartassistant.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

          # إنشاء ملف settings.gradle
          echo "include ':app'" > settings.gradle

          # إنشاء build.gradle الرئيسي
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # إعداد app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
              id 'kotlin-kapt'
          }

          android {
              namespace 'com.akhali.smartassistant'
              compileSdk 34

              defaultConfig {
                  applicationId "com.akhali.smartassistant"
                  minSdk 28
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.10.1'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              
              // Room Database
              implementation 'androidx.room:room-runtime:2.6.1'
              implementation 'androidx.room:room-ktx:2.6.1'
              kapt 'androidx.room:room-compiler:2.6.1'

              // Google AI (Gemini) & OkHttp & Gson
              implementation 'com.google.ai.client.generativeai:generativeai:0.2.0'
              implementation 'com.squareup.okhttp3:okhttp:4.11.0'
              implementation 'com.google.code.gson:gson:2.10.1'

              // Coroutines & Lifecycle
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
          }
          EOF

      - name: Build APK with Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          ./gradlew :app:assembleDebug --no-daemon -Pandroid.useAndroidX=true

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Akhali-App-Android9
          path: "app/build/outputs/apk/debug/*.apk"
