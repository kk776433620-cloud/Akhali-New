name: Auto-Structure and Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restructure Project Files Automatically
        run: |
          echo "=== Organizing project structure ==="
          mkdir -p app/src/main/java/com/example/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml

          # نقل ملفات المشروع إلى المسارات الصحيحة
          mv *.kt app/src/main/java/com/example/app/ 2>/dev/null || true
          mv AndroidManifest.xml app/src/main/ 2>/dev/null || true
          mv layout_*.xml app/src/main/res/layout/ 2>/dev/null || true
          mv accessibility_*.xml app/src/main/res/xml/ 2>/dev/null || true

          # إنشاء ملف settings.gradle
          echo "include ':app'" > settings.gradle

          # إنشاء build.gradle الرئيسي بإصدارات كوتلن و أندرويد الصحيحة والمستقرة
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # إعداد build.gradle الخاص بتطبيق app
          if [ -f "build.gradle.app" ]; then
            mv build.gradle.app app/build.gradle
          elif [ -f "build.gradle" ] && [ ! -f "app/build.gradle" ]; then
            cp build.gradle app/build.gradle
          fi

      - name: Fix Kotlin Version References
        run: |
          echo "kotlin.jvm.target.validation.mode=IGNORE" >> gradle.properties
          # تصحيح أي إشارة إلى الإصدار الخاطئ 17.10 واستبداله بـ 1.9.10
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's/17.10/1.9.10/g' {} +

      - name: Build Debug APK
        run: |
          gradle assembleDebug -Pkotlin.jvm.target.validation.mode=IGNORE

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Akhali-App-Android9
          path: "**/build/outputs/apk/debug/*.apk"
