name: Build Al-Kahali Assistant Production APK

on:
  push:
    branches: [ "main", "master", "رئيسي" ]
  pull_request:
    branches: [ "main", "master", "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile and Package Android Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper missing, generating wrapper and building..."
            gradle wrapper
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: AlKahali-Smart-Assistant-App
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 30
